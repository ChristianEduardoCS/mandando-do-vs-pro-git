<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>container</title>


    <style>
        .container {
            background-color: rgb(10, 106, 190);
            display: flex;
        } 

        .container>div {
            background-color: rgb(131, 3, 182);
            border: 1px solid black;
            padding: 10px;
            display: auto;
            text-align: center;
        }
    </style>


</head>





<body>
    <div class="container">
        <div>Exemplo item A</div>
        <div>Exemplo item B</div>
        <div>Exemplo item C</div>
        <div>Exemplo item D</div>
    </div>







</body>

</html>
