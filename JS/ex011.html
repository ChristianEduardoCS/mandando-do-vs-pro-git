<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div {
            background-color: darkblue;
            width: 200px;
            height: 200px;
        }
    </style>
</head>

<body>
    <h1>Getelements</h1>

    <div id="Quadrado" onclick="mudarCorDiv()">
        Azul
    </div>

    <p id="verde" onclick="verde()">
        verde
    </p>

    
    <p id="vermelho" onclick="vermelho()">
        vermelho
    </p>



    <script>
        function mudarCorDiv() {
            document.getElementById("Quadrado").style.backgroundColor = "blue"

        }
        function verde() {
            document.getElementById("Quadrado").style.backgroundColor = "green"
        }

        function vermelho() {
            document.getElementById("Quadrado").style.backgroundColor = "red"
        }



    </script>

</body>

</html>
